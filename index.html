<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-app-title="7WINDS"></title>
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />
    <style data-app-style>
        /* One knob controls everything: all sizes below are in rem.
           Scales with screen width: ~18px on phones, ~29px on a 1920px TV/monitor. */
        :root {
            --list-width: 44rem;
            --gutter: 1rem;
        }

        html {
            font-size: clamp(18px, 0.9vw + 12px, 34px);
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            margin: 0;
            padding-top: 4.5rem;
            background-color: #0e0f11;
            color: #e8eaed;
            font-size: 1rem;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        header {
            background-color: rgba(14, 15, 17, 0.8);
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid #23262b;
            color: #00ffcc;
            padding: 0.6rem max(var(--gutter), calc((100% - var(--list-width)) / 2));
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            box-sizing: border-box;
        }

        [data-app-back-button] {
            font-size: 0.8rem;
            font-family: inherit;
            padding: 0.4rem 1.1rem;
            min-height: 2.4rem;
            border: 1px solid #00ffcc;
            background-color: transparent;
            color: #00ffcc;
            cursor: pointer;
            border-radius: 0.5rem;
            transition: background-color 0.3s ease, color 0.3s ease;
            margin-right: 0;
        }

        [data-app-back-button]:hover,
        [data-app-back-button]:focus {
            background-color: #00ffcc;
            color: #121212;
            outline: none;
        }

        [data-app-header-title-container] {
            display: flex;
            align-items: center;
            margin-right: auto;
            padding: 0.2rem 0;
        }

        [data-app-header-title] {
            font-size: 1.3rem;
            text-align: left;
            margin: 0;
            font-weight: 600;
        }

        [data-app-header-title] a {
            text-decoration: none;
            color: inherit;
        }

        [data-app-logo] {
            height: 2rem;
            margin-right: 0.6rem;
        }

        [data-header-spacer] {
            width: auto;
            visibility: hidden;
        }

        /* ---------- Vertical hierarchical list ---------- */
        [data-app-content] {
            padding: 1.5rem var(--gutter) 4rem;
            max-width: var(--list-width);
            margin: 0 auto;
        }

        [data-app-content] ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        /* Nested levels: indented with a guide line */
        [data-app-content] ul ul {
            margin: 0.15rem 0 0.6rem 0.8rem;
            padding-left: 0.8rem;
            border-left: 2px solid #1f2227;
        }

        /* Link rows: tall, full-width, easy to tap */
        [data-app-link-item] {
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 3rem;
            margin: 0.25rem 0;
            padding: 0.7rem 1rem;
            box-sizing: border-box;
            background-color: #17191d;
            border: 1px solid #23262b;
            border-radius: 0.8rem;
            text-decoration: none;
            color: #e8eaed;
            font-size: 1.05rem;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        [data-app-link-item]::after {
            content: "\203A";
            color: #5b616b;
            font-size: 1.4em;
            line-height: 1;
            transition: color 0.15s ease, transform 0.15s ease;
        }

        [data-app-link-item]:hover {
            background-color: #1d2025;
            border-color: rgba(0, 255, 204, 0.45);
        }

        [data-app-link-item]:hover::after {
            color: #00ffcc;
            transform: translateX(3px);
        }

        [data-app-link-item]:active {
            background-color: #23272d;
        }

        /* Category headings (collapsible) */
        details {
            margin: 0.6rem 0 0.25rem;
        }

        summary {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            min-height: 3rem;
            padding: 0.5rem 0.4rem;
            box-sizing: border-box;
            cursor: pointer;
            list-style: none;
            color: #00ffcc;
            font-weight: 600;
            font-size: 1.15rem;
            border-radius: 0.7rem;
            user-select: none;
            transition: background-color 0.15s ease;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        summary::before {
            content: "\25B8";
            display: inline-block;
            width: 1em;
            font-size: 0.9em;
            color: #00ffcc;
            transition: transform 0.15s ease;
        }

        details[open]>summary::before {
            transform: rotate(90deg);
        }

        summary:hover {
            background-color: rgba(0, 255, 204, 0.07);
        }

        /* Strong, always-visible focus highlight (for keyboard / TV remote) */
        summary:focus,
        [data-app-link-item]:focus {
            outline: 3px solid #00ffcc;
            outline-offset: 2px;
        }

        summary:focus {
            background-color: rgba(0, 255, 204, 0.18);
        }

        [data-app-link-item]:focus {
            background-color: #1b2f2d;
            border-color: #00ffcc;
        }

        [data-app-link-item]:focus::after {
            color: #00ffcc;
            transform: translateX(3px);
        }

        /* Phones: use the full width, tighter indent */
        @media (max-width: 600px) {
            :root {
                --gutter: 0.8rem;
            }

            [data-app-content] {
                padding-top: 1rem;
                padding-bottom: 3rem;
            }

            [data-app-content] ul ul {
                margin-left: 0.4rem;
                padding-left: 0.6rem;
            }
        }
    </style>
</head>

<body>
    <header data-app-header>
        <div data-app-header-title-container>
            <img data-app-logo src="favicon-96x96.png" alt="Logo" style="margin-right: 5px;">
            <h1 data-app-header-title style="margin: 0;">
                <a data-title-link data-default-href="index.html"></a>
            </h1>
        </div>
        <button type="button" data-app-back-button>BACK</button>
        <div data-header-spacer></div>
    </header>

    <div data-app-content></div>

    <script data-app-script>
        document.addEventListener('DOMContentLoaded', function () {
            const titleElement = document.querySelector('[data-app-title]');
            const headerTitleLink = document.querySelector('[data-title-link]');
            const contentElement = document.querySelector('[data-app-content]');
            const backButton = document.querySelector('[data-app-back-button]');

            if (backButton) {
                backButton.addEventListener('click', () => window.history.back());
            }

            if (titleElement && headerTitleLink) {
                headerTitleLink.textContent = titleElement.getAttribute('data-app-title');
                headerTitleLink.href = headerTitleLink.getAttribute('data-default-href');
                document.title = headerTitleLink.textContent;
            }

            // Build a <ul> from an array of nodes.
            //  - node with "children"  -> collapsible category (any depth)
            //  - node with "url"       -> link (".json" urls open that file in this viewer)
            function buildList(nodes) {
                const ul = document.createElement('ul');

                nodes.forEach(node => {
                    const li = document.createElement('li');

                    if (Array.isArray(node.children)) {
                        const details = document.createElement('details');
                        // Categories start collapsed; set "open": true in the JSON to start expanded
                        details.open = node.open === true;

                        const summary = document.createElement('summary');
                        summary.textContent = node.displayName;
                        details.appendChild(summary);
                        details.appendChild(buildList(node.children));
                        li.appendChild(details);
                    } else if (node.url) {
                        const a = document.createElement('a');
                        a.setAttribute('data-app-link-item', '');
                        a.textContent = node.displayName;

                        if (!node.url.startsWith('http')) {
                            const currentUrl = new URL(window.location.href);
                            currentUrl.searchParams.set('json', node.url);
                            a.href = currentUrl;
                        } else {
                            a.href = node.url;
                        }
                        li.appendChild(a);
                    }

                    ul.appendChild(li);
                });

                return ul;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const currentJsonFile = urlParams.get('json') || 'default_links.json';

            fetch(currentJsonFile)
                .then(response => response.json())
                .then(data => {
                    if (Array.isArray(data)) {
                        contentElement.appendChild(buildList(data));

                        // Focusable items that are currently visible, in page order
                        // (items inside collapsed categories are skipped automatically)
                        const getItems = () => [
                            backButton,
                            ...contentElement.querySelectorAll('summary, a[data-app-link-item]')
                        ].filter(el => el && el.offsetParent !== null);

                        // Put focus on the first entry as soon as the page loads
                        const first = contentElement.querySelector('summary, a[data-app-link-item]');
                        if (first) first.focus();

                        // Remote control / keyboard: Up/Down move between items,
                        // Right opens a category, Left closes it (Enter/OK also toggles)
                        document.addEventListener('keydown', e => {
                            const items = getItems();
                            const i = items.indexOf(document.activeElement);

                            if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                                e.preventDefault();
                                if (i === -1) {
                                    items[0 + (items[0] === backButton ? 1 : 0)]?.focus();
                                } else {
                                    items[i + (e.key === 'ArrowDown' ? 1 : -1)]?.focus();
                                }
                            } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                                const el = document.activeElement;
                                if (el && el.tagName === 'SUMMARY') {
                                    e.preventDefault();
                                    el.parentElement.open = (e.key === 'ArrowRight');
                                } else if (e.key === 'ArrowLeft' && el) {
                                    // From a link, jump back up to its parent category
                                    const parent = el.closest('details');
                                    if (parent) {
                                        e.preventDefault();
                                        parent.open = false;
                                        parent.querySelector('summary').focus();
                                    }
                                }
                            }
                        });
                    } else {
                        contentElement.textContent = 'Error loading links.';
                    }
                })
                .catch(error => {
                    console.error('Error fetching JSON:', error);
                    contentElement.textContent = 'Failed to load links.';
                });
        });
    </script>
</body>

</html>
